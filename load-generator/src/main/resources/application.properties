# Swag Shop load generator: simulated shoppers that send steady traffic to the shop (the frontend), and the
# response times they see, for the demo control page

# ---------------------------------------------------------------------------------------------------------
# Load
#
#   load.<scenario>   low | medium | high: how hard the simulated shoppers use the feature
#
# Everything can be changed at runtime on the demo control page (/demo.html), and "Reset to defaults" goes back
# to the values below. Environment variables work too, e.g. LOAD_SEARCH=high.
# ---------------------------------------------------------------------------------------------------------
load.search=medium
load.pricing=medium
load.checkout=medium

load.traffic-enabled=true
%dev.load.traffic-enabled=false
%test.load.traffic-enabled=false

# Where the shoppers send their requests
shop.url=http://localhost:8080

# ---------------------------------------------------------------------------------------------------------
# Products
#
# The product ids for product pages and orders are fetched from the catalog service at start-up. The standalone
# profile uses the copy of products.json bundled with this service instead.
# ---------------------------------------------------------------------------------------------------------
catalog.url=http://localhost:8081
catalog.bundled=false
%standalone.catalog.bundled=true
%test.catalog.bundled=true

# ---------------------------------------------------------------------------------------------------------
# Quarkus
# ---------------------------------------------------------------------------------------------------------
quarkus.application.name=swag-shop-load-generator
quarkus.http.host=0.0.0.0
quarkus.http.port=8086
quarkus.http.test-port=0
