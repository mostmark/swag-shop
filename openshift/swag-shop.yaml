# Swag Shop on OpenShift, monitored by Cryostat.
#
# Deploy with scripts/openshift-deploy.sh, which builds the image in the cluster from the local build.
# Every resource carries the label app.kubernetes.io/part-of=swag-shop-demo, so the whole demo can be removed with:
#   oc delete all,imagestream,buildconfig -l app.kubernetes.io/part-of=swag-shop-demo -n <namespace>
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: src/main/docker/Dockerfile.jvm
  output:
    to:
      kind: ImageStreamTag
      name: swag-shop:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
  annotations:
    # Roll out a new pod whenever a new image is built
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"swag-shop:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"swag-shop\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swag-shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swag-shop
        app.kubernetes.io/part-of: swag-shop-demo
        # The Cryostat Operator injects the Cryostat Agent into pods with these labels
        cryostat.io/name: cryostat-sample
        cryostat.io/namespace: cryostat
    spec:
      containers:
        - name: swag-shop
          image: swag-shop:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # A small heap makes the memory leak visible within a couple of minutes
            - name: JAVA_OPTS_APPEND
              value: >-
                -Xms128m -Xmx256m
                -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
            # Smart trigger: the Agent starts a profiling recording by itself when CPU load stays high
            - name: CRYOSTAT_AGENT_SMART_TRIGGER_DEFINITIONS
              value: '[ProcessCpuLoad>0.5;TargetDuration>duration("20s")]~profile'
            # Demo state at start-up; everything can be changed on the demo control page
            - name: DEMO_TRAFFIC_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # A busy demo must never be restarted by the liveness probe
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  selector:
    app.kubernetes.io/name: swag-shop
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  to:
    kind: Service
    name: swag-shop
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
