# Swag Shop on OpenShift, monitored by Cryostat.
#
# Build and push the image with scripts/build-push-container.sh, then deploy with scripts/openshift-deploy.sh.
# Every resource carries the label app.kubernetes.io/part-of=swag-shop-demo, so the whole demo can be removed with:
#   oc delete all -l app.kubernetes.io/part-of=swag-shop-demo -n <namespace>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swag-shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swag-shop
        app.kubernetes.io/part-of: swag-shop-demo
        # The Cryostat Operator injects the Cryostat Agent into pods with these labels
        cryostat.io/name: cryostat-sample
        cryostat.io/namespace: cryostat
    spec:
      containers:
        - name: swag-shop
          image: quay.io/mostmark/swag-shop:latest
          # Always pull, so restarting the pod picks up a newly pushed :latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # A small heap makes the memory leak visible within a couple of minutes
            - name: JAVA_OPTS_APPEND
              value: >-
                -Xms128m -Xmx384m
                -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
            # The image defaults to ParallelGC; use G1 (the JVM default) so the memory leak behaves as it does locally
            - name: GC_CONTAINER_OPTIONS
              value: -XX:+UseG1GC
            # Smart trigger: when the heap stays more than 35 % full for 20 seconds (garbage alone never does that),
            # the Agent starts a recording with the memory leak template by itself.
            # (ProcessCpuLoad is not usable here: Cryostat Agent 0.7 reads it as 0.0 even when the CPU is busy.)
            - name: CRYOSTAT_AGENT_SMART_TRIGGER_DEFINITIONS
              value: '[HeapMemoryUsagePercent>0.35;TargetDuration>duration("20s")]~SwagShopMemoryLeak'
            # Demo state at start-up; everything can be changed on the demo control page
            - name: DEMO_TRAFFIC_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              # High search load needs about 3 cores. With a lower limit the pod is throttled and JFR's sampler
              # gets too few samples for the "Method Profiling" rule to turn red
              cpu: "4"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # A busy demo must never be restarted by the liveness probe
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  selector:
    app.kubernetes.io/name: swag-shop
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: swag-shop
  labels:
    app.kubernetes.io/name: swag-shop
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  to:
    kind: Service
    name: swag-shop
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
