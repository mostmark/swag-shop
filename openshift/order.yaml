# Swag Shop order service on OpenShift, monitored by Cryostat: checkout, which reserves the stock for every order line in the inventory service
#
# Build and push the images with scripts/build-push-container.sh, then deploy every service with
# scripts/openshift-deploy.sh. Every resource carries the label app.kubernetes.io/part-of=swag-shop-demo, so the
# whole demo can be removed with:
#   oc delete all -l app.kubernetes.io/part-of=swag-shop-demo -n <namespace>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swag-shop-order
  labels:
    app.kubernetes.io/name: swag-shop-order
    app.kubernetes.io/component: order
    app.kubernetes.io/part-of: swag-shop-demo
    # Shows the Quarkus icon in the OpenShift topology view
    app.openshift.io/runtime: quarkus
  annotations:
    # Draws the calls this service makes while it runs in the OpenShift topology view (the services fetch the
    # products from the catalog only at start-up, so that is left out)
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"swag-shop-inventory"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swag-shop-order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swag-shop-order
        app.kubernetes.io/component: order
        app.kubernetes.io/part-of: swag-shop-demo
        # The Cryostat Operator injects the Cryostat Agent into pods with these labels
        cryostat.io/name: cryostat-sample
        cryostat.io/namespace: cryostat
    spec:
      containers:
        - name: order
          image: quay.io/mostmark/swag-shop-order:latest
          # Always pull, so restarting the pod picks up a newly pushed :latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS_APPEND
              value: >-
                -Xmx256m
                -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
            # The image defaults to ParallelGC; use G1 (the JVM default), as when the services run locally
            - name: GC_CONTAINER_OPTIONS
              value: '-XX:+UseG1GC'
            # The products are fetched from the catalog at start-up
            - name: CATALOG_URL
              value: 'http://swag-shop-catalog:8080'
            # Every order line is reserved here
            - name: QUARKUS_REST_CLIENT_INVENTORY_URL
              value: 'http://swag-shop-inventory:8080'
          resources:
            # The CPU request is kept small: it is what the scheduler reserves, not what the service may use
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # A busy demo must never be restarted by the liveness probe
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: swag-shop-order
  labels:
    app.kubernetes.io/name: swag-shop-order
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  selector:
    app.kubernetes.io/name: swag-shop-order
  ports:
    - name: http
      port: 8080
      targetPort: http
