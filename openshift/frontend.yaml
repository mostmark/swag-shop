# Swag Shop frontend service on OpenShift, monitored by Cryostat: the web pages and the API they call, which passes each request on to the services
#
# Build and push the images with scripts/build-push-container.sh, then deploy every service with
# scripts/openshift-deploy.sh. Every resource carries the label app.kubernetes.io/part-of=swag-shop-demo, so the
# whole demo can be removed with:
#   oc delete all -l app.kubernetes.io/part-of=swag-shop-demo -n <namespace>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swag-shop-frontend
  labels:
    app.kubernetes.io/name: swag-shop-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: swag-shop-demo
    # Shows the Quarkus icon in the OpenShift topology view
    app.openshift.io/runtime: quarkus
  annotations:
    # Draws the calls between the services in the OpenShift topology view
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"swag-shop-catalog"},{"apiVersion":"apps/v1","kind":"Deployment","name":"swag-shop-search"},{"apiVersion":"apps/v1","kind":"Deployment","name":"swag-shop-pricing"},{"apiVersion":"apps/v1","kind":"Deployment","name":"swag-shop-inventory"},{"apiVersion":"apps/v1","kind":"Deployment","name":"swag-shop-order"},{"apiVersion":"apps/v1","kind":"Deployment","name":"swag-shop-load-generator"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swag-shop-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swag-shop-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: swag-shop-demo
        # The Cryostat Operator injects the Cryostat Agent into pods with these labels
        cryostat.io/name: cryostat-sample
        cryostat.io/namespace: cryostat
    spec:
      containers:
        - name: frontend
          image: quay.io/mostmark/swag-shop-frontend:latest
          # Always pull, so restarting the pod picks up a newly pushed :latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS_APPEND
              value: >-
                -Xmx256m
                -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
            # The image defaults to ParallelGC; use G1 (the JVM default), as when the services run locally
            - name: GC_CONTAINER_OPTIONS
              value: '-XX:+UseG1GC'
            # The services the frontend passes the requests on to
            - name: QUARKUS_REST_CLIENT_CATALOG_URL
              value: 'http://swag-shop-catalog:8080'
            - name: QUARKUS_REST_CLIENT_SEARCH_URL
              value: 'http://swag-shop-search:8080'
            - name: QUARKUS_REST_CLIENT_PRICING_URL
              value: 'http://swag-shop-pricing:8080'
            - name: QUARKUS_REST_CLIENT_INVENTORY_URL
              value: 'http://swag-shop-inventory:8080'
            - name: QUARKUS_REST_CLIENT_ORDER_URL
              value: 'http://swag-shop-order:8080'
            - name: QUARKUS_REST_CLIENT_LOAD_GENERATOR_URL
              value: 'http://swag-shop-load-generator:8080'
          resources:
            # The CPU request is kept small: it is what the scheduler reserves, not what the service may use
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            # A busy demo must never be restarted by the liveness probe
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: swag-shop-frontend
  labels:
    app.kubernetes.io/name: swag-shop-frontend
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  selector:
    app.kubernetes.io/name: swag-shop-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: swag-shop-frontend
  labels:
    app.kubernetes.io/name: swag-shop-frontend
    app.kubernetes.io/part-of: swag-shop-demo
spec:
  to:
    kind: Service
    name: swag-shop-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
