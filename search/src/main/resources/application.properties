# Swag Shop search service: typo-tolerant product search, with the CPU hotspot demo scenario

# ---------------------------------------------------------------------------------------------------------
# Demo scenario
#
#   problem-enabled  true  = run the naive implementation (the problem)
#                    false = run the fixed implementation
#
# The demo control page and scripts/search-problem.sh switch it at runtime. Environment variables work too,
# e.g. DEMO_SCENARIO_PROBLEM_ENABLED=true.
# ---------------------------------------------------------------------------------------------------------
demo.scenario.id=search
demo.scenario.feature=Product search
demo.scenario.problem-type=CPU hotspot
demo.scenario.symptom=At high load every search hangs for seconds, even a short one, and CPU climbs.
demo.scenario.cryostat-hint=Use high load and a Profiling recording. Automated Analysis: "Method Profiling" \
  points at RecursiveEditDistance.distance. Dashboard: process CPU load rises.
demo.scenario.problem-source=search/src/main/java/com/demo/shop/search/RecursiveEditDistance.java
demo.scenario.fix-source=search/src/main/java/com/demo/shop/search/IterativeEditDistance.java
demo.scenario.problem-enabled=false

# ---------------------------------------------------------------------------------------------------------
# Products
#
# The products are fetched from the catalog service at start-up. The standalone profile uses the copy of
# products.json bundled with this service instead, so search runs on its own (demo 1):
#   java -Dquarkus.profile=standalone -jar search/target/quarkus-app/quarkus-run.jar
# ---------------------------------------------------------------------------------------------------------
catalog.url=http://localhost:8081
catalog.bundled=false
%standalone.catalog.bundled=true
%test.catalog.bundled=true

# ---------------------------------------------------------------------------------------------------------
# Quarkus
# ---------------------------------------------------------------------------------------------------------
quarkus.application.name=swag-shop-search
quarkus.http.host=0.0.0.0
quarkus.http.port=8082
quarkus.http.test-port=0
