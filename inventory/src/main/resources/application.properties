# Swag Shop inventory service: stock levels and reservations, with the lock contention demo scenario

# ---------------------------------------------------------------------------------------------------------
# Demo scenario
#
#   problem-enabled  true  = run the naive implementation (the problem)
#                    false = run the fixed implementation
#
# The scenario is called checkout because shoppers notice it there: the order service waits for every
# reservation. The demo control page switches it at runtime. Environment variables work too, e.g.
# DEMO_SCENARIO_PROBLEM_ENABLED=true.
# ---------------------------------------------------------------------------------------------------------
demo.scenario.id=checkout
demo.scenario.feature=Checkout
demo.scenario.problem-type=Lock contention
demo.scenario.symptom=Checkouts get slow but CPU stays flat: threads are waiting, not working.
demo.scenario.cryostat-hint=Use high load. Orders are slow, but the order service only waits for inventory. In the \
  inventory pod's recording, Automated Analysis: "Java Blocking" names the SynchronizedInventory monitor and the \
  blocked threads. Dashboard: CPU stays low while latency rises.
demo.scenario.problem-source=inventory/src/main/java/com/demo/shop/inventory/SynchronizedInventory.java
demo.scenario.fix-source=inventory/src/main/java/com/demo/shop/inventory/PerProductLockInventory.java
demo.scenario.problem-enabled=false

# ---------------------------------------------------------------------------------------------------------
# Products
#
# The products are fetched from the catalog service at start-up. The standalone profile uses the copy of
# products.json bundled with this service instead.
# ---------------------------------------------------------------------------------------------------------
catalog.url=http://localhost:8081
catalog.bundled=false
%standalone.catalog.bundled=true
%test.catalog.bundled=true

# ---------------------------------------------------------------------------------------------------------
# Quarkus
# ---------------------------------------------------------------------------------------------------------
quarkus.application.name=swag-shop-inventory
quarkus.http.host=0.0.0.0
quarkus.http.port=8084
quarkus.http.test-port=0
