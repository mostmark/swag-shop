# Swag Shop order service: checkout. Reserves the stock for every order line in the inventory service, where the
# lock contention demo scenario is: orders get slow here, but the cause is in inventory.

# ---------------------------------------------------------------------------------------------------------
# Other services
#
# The products are fetched from the catalog service at start-up. The standalone profile uses the copy of
# products.json bundled with this service instead (the inventory service is still needed for orders).
# ---------------------------------------------------------------------------------------------------------
catalog.url=http://localhost:8081
catalog.bundled=false
%standalone.catalog.bundled=true
%test.catalog.bundled=true

quarkus.rest-client.inventory.url=http://localhost:8084

# ---------------------------------------------------------------------------------------------------------
# Quarkus
# ---------------------------------------------------------------------------------------------------------
quarkus.application.name=swag-shop-order
quarkus.http.host=0.0.0.0
quarkus.http.port=8085
quarkus.http.test-port=0
