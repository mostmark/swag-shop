# Swag Shop pricing service: product prices from two years of price history, with the memory leak demo scenario

# ---------------------------------------------------------------------------------------------------------
# Demo scenario
#
#   problem-enabled  true  = run the naive implementation (the problem)
#                    false = run the fixed implementation
#
# The demo control page switches it at runtime. Environment variables work too, e.g.
# DEMO_SCENARIO_PROBLEM_ENABLED=true.
# ---------------------------------------------------------------------------------------------------------
demo.scenario.id=pricing
demo.scenario.feature=Product prices
demo.scenario.problem-type=Memory leak
demo.scenario.symptom=Heap usage climbs like a staircase and never comes back down after GC.
demo.scenario.cryostat-hint=Dashboard of the pricing pod: heap used keeps growing. The Agent's smart trigger starts a \
  SwagShopMemoryLeak recording (paths to GC roots); its Automated Analysis turns "Heap Live Set Trend" red and names \
  the leak candidate: PricePoint objects held by RequestQuoteCache.
demo.scenario.problem-source=pricing/src/main/java/com/demo/shop/pricing/RequestQuoteCache.java
demo.scenario.fix-source=pricing/src/main/java/com/demo/shop/pricing/ProductQuoteCache.java
demo.scenario.problem-enabled=false

# The leaking cache stops growing at this fraction of the maximum heap, so the demo never runs out of memory
pricing.leak-max-heap-ratio=0.7

# ---------------------------------------------------------------------------------------------------------
# Products
#
# The products are fetched from the catalog service at start-up. The standalone profile uses the copy of
# products.json bundled with this service instead.
# ---------------------------------------------------------------------------------------------------------
catalog.url=http://localhost:8081
catalog.bundled=false
%standalone.catalog.bundled=true
%test.catalog.bundled=true

# ---------------------------------------------------------------------------------------------------------
# Quarkus
# ---------------------------------------------------------------------------------------------------------
quarkus.application.name=swag-shop-pricing
quarkus.http.host=0.0.0.0
quarkus.http.port=8083
quarkus.http.test-port=0
