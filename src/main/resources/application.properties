# Swag Shop: a sample web shop with switchable performance problems for JFR and Cryostat demos

# ---------------------------------------------------------------------------------------------------------
# Demo scenarios
#
#   problem-enabled  true  = run the naive implementation (the problem)
#                    false = run the fixed implementation
#   load             low | medium | high: how hard the simulated shoppers use the feature
#
# Everything can be changed at runtime on the demo control page (/demo.html), and "Reset to defaults"
# goes back to the values below. Environment variables work too, e.g. DEMO_SEARCH_PROBLEM_ENABLED=true.
# ---------------------------------------------------------------------------------------------------------

# Product search: recursive edit distance (CPU hotspot)
demo.search.problem-enabled=false
demo.search.load=medium

# Product prices: price quote cache keyed on the request id (memory leak)
demo.pricing.problem-enabled=false
demo.pricing.load=medium

# Checkout: one global lock held during the warehouse call (lock contention)
demo.checkout.problem-enabled=false
demo.checkout.load=medium

# Simulated shoppers that send steady traffic to the shop
demo.traffic.enabled=true
%dev.demo.traffic.enabled=false
%test.demo.traffic.enabled=false

# The leaking cache stops growing at this fraction of the maximum heap, so the demo never runs out of memory
demo.safety.leak-max-heap-ratio=0.7

# ---------------------------------------------------------------------------------------------------------
# Quarkus
# ---------------------------------------------------------------------------------------------------------
quarkus.application.name=swag-shop
quarkus.http.host=0.0.0.0

# Integration tests run the packaged app with the test profile, so the simulated shoppers stay off
quarkus.test.integration-test-profile=test

# Product photos never change: let browsers cache them
quarkus.http.filter.images.header."Cache-Control"=max-age=86400
quarkus.http.filter.images.matches=/img/.*

# Pages, scripts and styles are revalidated, so a redeployed shop never runs stale JavaScript
quarkus.http.filter.assets.header."Cache-Control"=no-cache
quarkus.http.filter.assets.matches=/|/.*\\.html|/js/.*|/css/.*
