# Swag Shop frontend: the web pages, and the API they call, which passes each request on to the services

# ---------------------------------------------------------------------------------------------------------
# Services
#
# The frontend serves the web pages and passes every API call on to these services. The demo scenarios'
# defaults are set in each service; the load levels in the load generator.
# ---------------------------------------------------------------------------------------------------------
quarkus.rest-client.catalog.url=http://localhost:8081
quarkus.rest-client.search.url=http://localhost:8082
quarkus.rest-client.pricing.url=http://localhost:8083
quarkus.rest-client.inventory.url=http://localhost:8084
quarkus.rest-client.order.url=http://localhost:8085
quarkus.rest-client.load-generator.url=http://localhost:8086

# With a problem on, up to 40 searches and 40 orders from the simulated shoppers wait for an answer at the same
# time; the frontend must not make them wait for a connection as well
quarkus.rest-client.connection-pool-size=100

# ---------------------------------------------------------------------------------------------------------
# Quarkus
# ---------------------------------------------------------------------------------------------------------
quarkus.application.name=swag-shop-frontend
quarkus.http.host=0.0.0.0
quarkus.http.test-port=0

# Product photos never change: let browsers cache them
quarkus.http.filter.images.header."Cache-Control"=max-age=86400
quarkus.http.filter.images.matches=/img/.*

# Pages, scripts and styles are revalidated, so a redeployed shop never runs stale JavaScript
quarkus.http.filter.assets.header."Cache-Control"=no-cache
quarkus.http.filter.assets.matches=/|/.*\\.html|/js/.*|/css/.*
